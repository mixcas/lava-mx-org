# Pages CMS configuration (2.x) — https://pagescms.org/docs/configuration/
#
# Editors sign in at https://app.pagescms.org and pick a branch; every save is a
# commit on that branch. Field labels and descriptions are Spanish because the
# editors are curators; the CMS interface chrome stays English.

settings:
  content:
    # Merge the submitted fields into the existing file: front-matter keys
    # outside the schema below (variant, …) are preserved on save.
    merge: true

# Where uploads are stored and which public URL each field writes into front
# matter. `output` must be the URL the site serves the file at: images are
# processed by the Eleventy image pipeline from their masters, videos and
# documents are copied verbatim. `rename: false` keeps the original filename,
# the only name that matches the media the templates already reference.
media:
  - name: images
    label: Imágenes
    input: src/assets/images
    output: /assets/images
    # Formats the image pipeline can process. Anything else (SVG, TIFF, ICO,
    # HEIC, …) is rejected here rather than breaking the build.
    extensions: [webp, jpg, jpeg, png, avif, gif]
    rename: false
  - name: videos
    label: Videos
    input: src/assets/videos
    output: /assets/videos
    extensions: [mp4, webm]
    rename: false
  - name: documents
    label: Documentos
    input: src/assets/files
    output: /assets/files
    extensions: [pdf]
    rename: false

content:
  - name: proyectos
    label: Proyectos
    type: collection
    path: src/proyectos
    # Pages CMS has no URL-change warning of its own, so the warning lives in
    # the only two places the app can render for this collection: this
    # description and the `title` field description (the filename is seeded
    # from the title). Verify that both are visible on create and edit before
    # handing the CMS to editors (see README → «Pages CMS»).
    description: >-
      El nombre del archivo (campo «Filename», al inicio del formulario) define
      la dirección pública del proyecto: /proyectos/nombre-del-archivo/.
      Cambiarlo cambia la URL pública y rompe los enlaces y marcadores
      existentes; Git es la única forma de recuperarla después.
    filename:
      # Default filename from the title, without Eleventy's date prefix.
      template: "{primary}.md"
      # Visible when creating and when editing (the app locks it until the
      # editor unlocks it), so the URL is never a hidden setting.
      field: true
    exclude:
      # Directory-level defaults for Eleventy, not a project entry. `exclude`
      # matches exact basenames.
      - proyectos.11tydata.json
    operations:
      create: true
      rename: true
      delete: true
    view:
      primary: title
      fields: [title, featured, order, dates]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        description: >-
          Nombre público del proyecto. Al crear un proyecto, el nombre del
          archivo (y por tanto la dirección pública) se genera a partir del
          título; si lo cambias después, cambia la URL.
      - name: venue
        label: Sede
        type: string
        description: Espacio donde se presentó el proyecto (galería, museo, ciudad).
      - name: dates
        label: Fechas
        type: string
        description: >-
          Fechas de exhibición tal como se muestran en la página del proyecto;
          admite Markdown.
      - name: featured
        label: Proyecto en portada
        type: boolean
        default: false
        description: >-
          Actívalo para que el proyecto aparezca en la portada. Si está
          desactivado, aparece en «Proyectos anteriores». Es una decisión
          editorial y no depende de las fechas.
      - name: order
        label: Orden
        type: number
        default: 0
        description: >-
          Posición dentro de su grupo (portada o proyectos anteriores); el
          número menor aparece primero.
      - name: gallery_columns
        label: Columnas de la galería
        type: number
        default: 1
        options:
          min: 1
          max: 2
        description: >-
          Una columna (1) para imágenes que se ven una debajo de otra, dos
          columnas (2) para pares de obras. Solo se admiten los valores 1 y 2.
      - name: media
        label: Galería
        type: block
        list: true
        # Each item stores its media type under `type`, next to that type's
        # fields: the template reads the type, not a boolean video flag.
        #
        # The gallery is one ordered list for every project. The three-column
        # project keeps only a hidden `variant` key outside this schema; the
        # template splits its gallery in half (first half rounded up goes to the
        # first column), so editors reorder a single list.
        blockKey: type
        description: >-
          Los medios del proyecto, en el orden en que se muestran. Añade una
          imagen o un video, elige uno existente o sube uno nuevo, y arrastra
          los elementos para reordenarlos.
        blocks:
          - name: image
            label: Imagen
            fields:
              - name: src
                label: Imagen
                type: image
                required: true
                options:
                  media: images
                description: >-
                  Elige una imagen de la biblioteca o sube una nueva. Solo se
                  aceptan WebP, JPG, JPEG, PNG, AVIF y GIF.
              - name: alt
                label: Texto alternativo
                type: string
                description: >-
                  Describe la imagen para quien usa lector de pantalla. Si lo
                  dejas vacío, se usa el título del proyecto.
          - name: video
            label: Video
            fields:
              - name: src
                label: Video
                type: file
                required: true
                options:
                  media: videos
                description: >-
                  Elige un video de la biblioteca o sube uno nuevo. Solo se
                  aceptan MP4 y WebM.
              - name: poster
                label: Imagen de portada del video
                type: image
                options:
                  media: images
                description: >-
                  Imagen fija que se ve antes de reproducir el video y que se
                  usa al compartir el proyecto.
              - name: autoplay
                label: Reproducción automática
                type: boolean
                default: false
                description: >-
                  Reproduce el video al cargar la página. Los navegadores solo
                  lo permiten si el video también está silenciado.
              - name: loop
                label: Repetir
                type: boolean
                default: false
                description: Vuelve a empezar el video cuando termina.
              - name: mute
                label: Silenciar
                type: boolean
                default: false
                description: Reproduce el video sin sonido.
